plugins {
    id 'java'
    id 'io.quarkus' version '3.40.1'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:3.40.1")
    implementation "io.quarkiverse.mcp:quarkus-mcp-server-stdio:2.0.2"
    implementation "org.seleniumhq.selenium:selenium-java:4.50.0"
}
