plugins {
    id 'java'
    id 'io.quarkus' version '4.0.0'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:3.40.1.2")
    implementation "io.quarkiverse.mcp:quarkus-mcp-server-stdio:2.1.0"
    implementation "org.seleniumhq.selenium:selenium-java:4.54.0"
}
